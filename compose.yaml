name: cv-builder

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      DATABASE_URL: 'postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}'
      BETTER_AUTH_SECRET: '${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}'
      BETTER_AUTH_URL: '${BETTER_AUTH_URL:-http://localhost:3000}'
      BETTER_AUTH_TRUSTED_ORIGINS: '${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:3000}'
      API_JWT_ISSUER: '${API_JWT_ISSUER:-http://localhost:3000}'
      API_JWT_AUDIENCE: '${API_JWT_AUDIENCE:-cv-builder-api}'
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    networks:
      - app-network
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    restart: on-failure:3
    stop_grace_period: 15s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: '3001'
      CORS_ORIGINS: '${CORS_ORIGINS:-http://localhost:3000}'
      SWAGGER_ENABLED: '${SWAGGER_ENABLED:-false}'
      DATABASE_URL: 'postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}'
      REDIS_HOST: valkey
      REDIS_PORT: '6379'
      REDIS_DB: '${REDIS_DB:-0}'
      REDIS_USERNAME: '${REDIS_USERNAME:-}'
      REDIS_PASSWORD: '${REDIS_PASSWORD:-}'
      REDIS_TLS: 'false'
      MINIO_ENDPOINT: minio
      MINIO_PORT: '9000'
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: '${MINIO_ROOT_USER}'
      MINIO_SECRET_KEY: '${MINIO_ROOT_PASSWORD}'
      MINIO_BUCKET: '${MINIO_BUCKET:-cv-imports}'
      AUTH_JWKS_URL: 'http://web:3000/api/auth/jwks'
      API_JWT_ISSUER: '${API_JWT_ISSUER:-http://localhost:3000}'
      API_JWT_AUDIENCE: '${API_JWT_AUDIENCE:-cv-builder-api}'
    init: true
    networks:
      - app-network
    ports:
      - '127.0.0.1:${API_PORT:-3001}:3001'
    restart: on-failure:3
    stop_grace_period: 15s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: document-processing
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      REDIS_HOST: valkey
      REDIS_PORT: '6379'
      REDIS_DB: '${REDIS_DB:-0}'
      REDIS_TLS: 'false'
      WORKER_CONCURRENCY: '${WORKER_CONCURRENCY:-1}'
      WORKER_NAME: '${WORKER_NAME:-cv-builder-worker}'
      WORKER_SHUTDOWN_TIMEOUT_MS: '${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}'
      DATABASE_URL: 'postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}'
      MINIO_ENDPOINT: minio
      MINIO_PORT: '9000'
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: '${MINIO_ROOT_USER}'
      MINIO_SECRET_KEY: '${MINIO_ROOT_PASSWORD}'
      MINIO_BUCKET: '${MINIO_BUCKET:-cv-imports}'
      OPENAI_API_KEY: '${OPENAI_API_KEY:-}'
      OPENAI_MODEL: '${OPENAI_MODEL:-}'
      CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
    init: true
    security_opt:
      - seccomp=./docker/chromium-seccomp.json
    networks:
      - app-network
    restart: on-failure:3
    stop_grace_period: '${WORKER_STOP_GRACE_PERIOD:-35s}'

  valkey:
    image: valkey/valkey:8.1.9-trixie
    command:
      - valkey-server
      - --appendonly
      - 'yes'
    healthcheck:
      test:
        - CMD-SHELL
        - '[ "$$(valkey-cli ping)" = "PONG" ]'
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    networks:
      - app-network
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    volumes:
      - valkey-data:/data

  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: '${POSTGRES_DB:?POSTGRES_DB is required}'
      POSTGRES_USER: '${POSTGRES_USER:?POSTGRES_USER is required}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}'
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    networks:
      - app-network
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    volumes:
      - postgres-data:/var/lib/postgresql

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: '${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}'
      MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}'
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app-network]
    volumes: [minio-data:/data]
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: [/bin/sh, -c]
    command:
      [
        'mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing local/$$MINIO_BUCKET && mc anonymous set none local/$$MINIO_BUCKET',
      ]
    environment:
      MINIO_ROOT_USER: '${MINIO_ROOT_USER}'
      MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD}'
      MINIO_BUCKET: '${MINIO_BUCKET:-cv-imports}'
    networks: [app-network]

networks:
  app-network:

volumes:
  valkey-data:
  postgres-data:
  minio-data:
