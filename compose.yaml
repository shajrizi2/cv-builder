name: cv-builder

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
    init: true
    networks:
      - app-network
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    restart: on-failure:3
    stop_grace_period: 15s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: '3001'
      CORS_ORIGINS: '${CORS_ORIGINS:-http://localhost:3000}'
      SWAGGER_ENABLED: '${SWAGGER_ENABLED:-false}'
    init: true
    networks:
      - app-network
    ports:
      - '127.0.0.1:${API_PORT:-3001}:3001'
    restart: on-failure:3
    stop_grace_period: 15s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: production
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REDIS_HOST: valkey
      REDIS_PORT: '6379'
      REDIS_DB: '${REDIS_DB:-0}'
      REDIS_TLS: 'false'
      WORKER_CONCURRENCY: '${WORKER_CONCURRENCY:-1}'
      WORKER_NAME: '${WORKER_NAME:-cv-builder-worker}'
      WORKER_SHUTDOWN_TIMEOUT_MS: '${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}'
    init: true
    networks:
      - app-network
    restart: on-failure:3
    stop_grace_period: '${WORKER_STOP_GRACE_PERIOD:-35s}'

  valkey:
    image: valkey/valkey:8.1.9-trixie
    command:
      - valkey-server
      - --appendonly
      - 'yes'
    healthcheck:
      test:
        - CMD-SHELL
        - '[ "$$(valkey-cli ping)" = "PONG" ]'
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    networks:
      - app-network
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    volumes:
      - valkey-data:/data

networks:
  app-network:

volumes:
  valkey-data:
