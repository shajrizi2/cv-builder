services:
  web:
    build:
      target: development
    command:
      - npm
      - run
      - dev
      - --workspace=@cv-builder/web
      - --
      - --hostname
      - 0.0.0.0
    environment:
      NODE_ENV: development
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health', {
          signal: AbortSignal.timeout(4000) }).then((response) => {
          if (response.status !== 200) process.exit(1);
          }).catch(() => process.exit(1));
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: 'no'
    volumes:
      - ./apps/web/app:/app/apps/web/app
      - ./apps/web/lib:/app/apps/web/lib
      - ./apps/web/tests:/app/apps/web/tests
      - ./apps/web/next-env.d.ts:/app/apps/web/next-env.d.ts
      - ./apps/web/next.config.ts:/app/apps/web/next.config.ts
      - ./apps/web/postcss.config.mjs:/app/apps/web/postcss.config.mjs
      - ./apps/web/tsconfig.json:/app/apps/web/tsconfig.json

  api:
    build:
      target: development
    command:
      - npm
      - run
      - dev
      - --workspace=@cv-builder/api
    environment:
      NODE_ENV: development
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const port = process.env.API_PORT || 3001;
          fetch(`http://127.0.0.1:$${port}/api/health`, {
          signal: AbortSignal.timeout(4000) }).then(async (response) => {
          if (response.status !== 200) throw new Error('Unexpected status');
          const body = await response.json();
          if (body.status !== 'ok' || body.service !== 'api')
          throw new Error('Invalid response');
          }).catch(() => process.exit(1));
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: 'no'
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/test:/app/apps/api/test
      - ./apps/api/nest-cli.json:/app/apps/api/nest-cli.json
      - ./apps/api/tsconfig.build.json:/app/apps/api/tsconfig.build.json
      - ./apps/api/tsconfig.json:/app/apps/api/tsconfig.json

  worker:
    build:
      target: development
    command:
      - npm
      - run
      - dev
      - --workspace=@cv-builder/worker
    environment:
      NODE_ENV: development
    healthcheck:
      test:
        - CMD
        - node
        - --import
        - tsx
        - apps/worker/src/healthcheck.ts
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: 'no'
    volumes:
      - ./apps/worker/src:/app/apps/worker/src
      - ./apps/worker/tests:/app/apps/worker/tests
      - ./apps/worker/tsconfig.build.json:/app/apps/worker/tsconfig.build.json
      - ./apps/worker/tsconfig.json:/app/apps/worker/tsconfig.json
